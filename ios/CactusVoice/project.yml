name: CactusVoice
options:
  bundleIdPrefix: com.ayaangazali.cactusvoice
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CactusVoice:
    type: application
    platform: iOS
    sources:
      - path: CactusVoice
        excludes:
          - "Cactus/cactus-ios.xcframework"
      - path: Shared
    info:
      path: CactusVoice/Info.plist
      properties:
        CFBundleDisplayName: Cactus Voice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
        NSMicrophoneUsageDescription: Cactus Voice records your voice on-device to transcribe commands using Whisper.
        NSLocalNetworkUsageDescription: Cactus Voice sends transcribed commands to your paired Mac on the local network.
        NSBonjourServices:
          - _cactus._tcp
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - audio
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayaangazali.cactusvoice
        CODE_SIGN_ENTITLEMENTS: CactusVoice/CactusVoice.entitlements
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/CactusVoice/Cactus
        OTHER_LDFLAGS:
          - $(inherited)
    dependencies:
      - framework: CactusVoice/Cactus/cactus-ios.xcframework
        embed: true
        codeSign: true
      - target: CactusVoiceWidget
      - package: ZIPFoundation
        product: ZIPFoundation

  CactusVoiceWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CactusVoiceWidget
      - path: Shared
    info:
      path: CactusVoiceWidget/Info.plist
      properties:
        CFBundleDisplayName: Cactus Voice Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayaangazali.cactusvoice.widget
        SKIP_INSTALL: YES

  CactusVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CactusVoiceTests
    info:
      path: CactusVoiceTests/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ayaangazali.cactusvoice.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/CactusVoice.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CactusVoice
    dependencies:
      - target: CactusVoice

schemes:
  CactusVoice:
    build:
      targets:
        CactusVoice: all
        CactusVoiceWidget: all
    test:
      gatherCoverageData: true
      targets:
        - CactusVoiceTests
    run:
      config: Debug
    archive:
      config: Release

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
